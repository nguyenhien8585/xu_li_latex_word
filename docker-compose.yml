version: '3.8'

services:
  word-processor:
    build:
      context: .
      dockerfile: Dockerfile
      target: base  # hoặc 'lightweight' cho version nhẹ hơn
    ports:
      - "8501:8501"
    volumes:
      - ./temp:/tmp/word_processor
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - word-processor
    restart: unless-stopped

  # Optional: redis for caching (future feature)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:

# ===================================
# Development version
# ===================================
---
version: '3.8'

services:
  word-processor-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: lightweight
    ports:
      - "8501:8501"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - ./temp:/tmp/word_processor
    environment:
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.fileWatcherType=poll"]
    restart: unless-stopped

# ===================================
# Production with load balancer
# ===================================
---
version: '3.8'

services:
  word-processor-1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501"
    volumes:
      - ./temp:/tmp/word_processor
    environment:
      - INSTANCE_ID=1
    restart: unless-stopped

  word-processor-2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501"
    volumes:
      - ./temp:/tmp/word_processor
    environment:
      - INSTANCE_ID=2
    restart: unless-stopped

  load-balancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - word-processor-1
      - word-processor-2
    restart: unless-stopped
