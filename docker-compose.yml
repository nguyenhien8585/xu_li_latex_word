version: '3.8'

services:
  latex-word-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latex-word-app
    ports:
      - "8501:8501"
    volumes:
      # Mount output directory for persistent storage
      - ./output:/app/output
      # Optional: Mount input directory for batch processing
      - ./input:/app/input:ro
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: latex-word-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - latex-word-converter
  #   restart: unless-stopped

# Optional: Add volumes for persistent data
volumes:
  app_data:
    driver: local

# Optional: Custom network
networks:
  latex_network:
    driver: bridge
